[package]
    name = "flex-student-client"
    version = "0.1.0"
    description = "FLEX Student Endpoint Security Agent"
    authors = ["Renan Alves"]
    edition = "2021"
    rust-version = "1.70"

    # See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "flex_client_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

    [build-dependencies]
    tauri-build = { version = "2", features = [] }

    [dependencies]
    # Tauri Core
    tauri = { version = "2", features = [] }
    serde = { version = "1.0", features = ["derive"] }
    serde_json = "1.0"
    sysproxy = "0.3.0"

    # Async Runtime & Networking (Useful for local proxy and WebSocket heartbeats)
    tokio = { version = "1.35", features = ["full"] }
    reqwest = { version = "0.11", features = ["json"] }
    tokio-tungstenite = "0.21" # Great for WebSocket connection to the Express backend
    futures-util = "0.3"

    # Logging and Diagnostics
    log = "0.4"
    env_logger = "0.11"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"

    [features]
    # This feature is used for Tauri production builds vs custom dev logic
    custom-protocol = ["tauri/custom-protocol"]

    [profile.release]
    panic = "abort"
    codegen-units = 1
    lto = true
    opt-level = "s"
    strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
